# Railway configuration for the backend (API) service.
# Service Root Directory must be set to: apps/api
# Builds the Go API via apps/api/Dockerfile and health-checks /health.
#
# Required service variables (set in Railway -> Variables):
#   ALLOWED_ORIGIN = https://<frontend-url>   # enables browser CORS from the web app
# Railway injects PORT automatically; the API binds to it at runtime.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
restartPolicyType = "ALWAYS"
