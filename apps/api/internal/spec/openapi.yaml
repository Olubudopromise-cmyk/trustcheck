openapi: 3.1.0
info:
  title: TrustCheck API
  version: 1.0.0
  description: >
    TrustCheck API verifies the trustworthiness of a user-supplied input —
    a domain, URL, email address, phone number, company name, or IP address.
    Each input is classified, checked against public DNS, web, telephone, and
    registry evidence, and scored from 0 to 100. The API powers the TrustCheck
    web application and is available to any client that speaks HTTP JSON.
  contact:
    name: TrustCheck
    url: https://github.com/pamierin/trustcheck
servers:
  - url: http://localhost:8080
    description: Local development server
paths:
  /health:
    get:
      operationId: getHealth
      summary: Service health check
      description: Returns the service name and liveness status of the API.
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /verify:
    post:
      operationId: verifyInput
      summary: Verify a single input
      description: >
        Classifies the input and returns an explainable analysis: the detected
        type, a trust score from 0 to 100, a High/Medium/Low verdict, the
        extracted main claim with its entities and keywords, evidence split into
        supporting and contradicting sections, alternative interpretations,
        misinformation warning signals, an explanation of the score, and
        recommended next steps. It also returns the multi-perspective fact
        analysis: evidence grouped by source, contradictions, missing
        information, a user-facing confidence breakdown, an AI summary,
        suggested reading, and a "what changed" story timeline.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
            examples:
              domain:
                summary: Domain
                value:
                  input: google.com
              url:
                summary: URL
                value:
                  input: https://google.com
              ip:
                summary: IP address
                value:
                  input: 8.8.8.8
              phone:
                summary: Phone number
                value:
                  input: '+2348012345678'
              company:
                summary: Company name
                value:
                  input: Google
              unknown:
                summary: Unrecognized input
                value:
                  input: '???'
      responses:
        '200':
          description: Verification complete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResponse'
              examples:
                domain:
                  summary: Domain verification
                  value:
                    input: google.com
                    type: domain
                    status: verified
                    trustScore: 60
                    summary: Domain resolves and has a valid HTTPS certificate.
                    evidence:
                      - label: HTTPS Available
                        result: pass
                        points: 20
        '400':
          description: Invalid or missing input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing-input:
                  summary: Missing input field
                  value:
                    error: input is required
                malformed-json:
                  summary: Malformed request body
                  value:
                    error: 'invalid request: input is required'
components:
  schemas:
    Health:
      type: object
      required:
        - service
        - status
      properties:
        service:
          type: string
          enum:
            - trustcheck-api
          description: Name of the service.
        status:
          type: string
          enum:
            - ok
          description: Liveness status.
      example:
        service: trustcheck-api
        status: ok
    VerifyRequest:
      type: object
      required:
        - input
      properties:
        input:
          type: string
          minLength: 1
          description: The value to verify (domain, URL, email, phone number, company name, or IP address).
      example:
        input: google.com
    VerifyResponse:
      type: object
      required:
        - input
        - type
        - status
        - trustScore
        - summary
        - evidence
        - verdict
        - keyClaim
        - confidence
      properties:
        input:
          type: string
          description: The original input, echoed back unchanged.
        type:
          $ref: '#/components/schemas/InputType'
        status:
          $ref: '#/components/schemas/VerificationStatus'
          description: Canonical status derived from the verdict (High -> verified, Medium -> warning, Low -> invalid) so status and verdict can never disagree.
        trustScore:
          type: integer
          minimum: 0
          maximum: 100
          description: Trust score from 0 (untrusted) to 100 (fully trusted).
        summary:
          type: string
          description: Human-readable summary of the verification result.
        evidence:
          type: array
          description: Ordered list of evidence items that contributed to the score (legacy field).
          items:
            $ref: '#/components/schemas/Evidence'
        verdict:
          $ref: '#/components/schemas/Verdict'
        keyClaim:
          type: string
          description: The single claim under review, extracted from the input before scoring.
        entities:
          type: array
          description: Named things (organizations, people, locations, dates) mentioned in the input.
          items:
            $ref: '#/components/schemas/Entity'
        keywords:
          type: array
          items:
            type: string
          description: Important keywords extracted from the input.
        evidenceFor:
          type: array
          description: Scored checks that support the claim.
          items:
            $ref: '#/components/schemas/EvidenceItem'
        evidenceAgainst:
          type: array
          description: Scored checks that contradict or caution against the claim.
          items:
            $ref: '#/components/schemas/EvidenceItem'
        missingEvidence:
          type: array
          items:
            type: string
          description: Checks that could not be performed. Never fabricated.
        unknownInformation:
          type: array
          items:
            type: string
          description: Facts that are genuinely unknown (author, provenance, ownership, ...).
        interpretations:
          type: array
          description: Two to three plausible readings of the input.
          items:
            $ref: '#/components/schemas/Interpretation'
        warningSignals:
          type: array
          description: Structured misinformation indicators detected in the input.
          items:
            $ref: '#/components/schemas/WarningSignal'
        confidence:
          type: integer
          minimum: 0
          maximum: 100
          description: How confident the analysis is in its own assessment (not the trust score).
        reasoning:
          type: array
          items:
            type: string
          description: Bullet explanation of why the trust score is what it is. "+" bullets support, "-" bullets contradict.
        timeline:
          type: array
          description: The step-by-step reasoning timeline shown at the top of the analysis.
          items:
            $ref: '#/components/schemas/ReasoningStep'
        recommendations:
          type: array
          description: Actionable next steps for the user.
          items:
            $ref: '#/components/schemas/Recommendation'
        supportingEvidence:
          type: array
          description: Supporting evidence grouped by the category of source it came from.
          items:
            $ref: '#/components/schemas/SourceGroup'
        contradictingEvidence:
          type: array
          description: Disagreements found between the submitted claim and the observed evidence, or between sources.
          items:
            $ref: '#/components/schemas/Contradiction'
        missingInformation:
          type: array
          description: The "What is missing?" section. Never fabricated.
          items:
            $ref: '#/components/schemas/MissingInfo'
        confidenceBreakdown:
          $ref: '#/components/schemas/ConfidenceBreakdown'
        aiSummary:
          type: string
          description: AI-generated summary of the assessment (max 120 words), labeled as a summary of the structured sections.
        suggestedReading:
          type: array
          description: Recommended reading. Links are never fabricated; when no specific article is known the section says so.
          items:
            $ref: '#/components/schemas/SuggestedReading'
        suggestedReadingNote:
          type: string
          description: Honest statement shown when no specific reading could be identified.
        whatChanged:
          type: array
          description: Dated evolution of the story. Dates are only ever observed ones.
          items:
            $ref: '#/components/schemas/ChangeEvent'
        whatChangedNote:
          type: string
          description: Honest statement shown when no dated timeline could be reconstructed.
    ReasoningStep:
      type: object
      required:
        - title
        - summary
        - details
      properties:
        title:
          type: string
          description: Name of the step, e.g. "Claim Detected" or "Evidence Gathered".
        summary:
          type: string
          description: One-line, user-facing summary of this step.
        details:
          type: array
          items:
            type: string
          description: Expandable detail lines. Only user-facing explanations grounded in observable evidence; never chain-of-thought.
    Verdict:
      type: string
      description: Coarse human-facing trust band derived from the trust score.
      enum:
        - High
        - Medium
        - Low
    Entity:
      type: object
      required:
        - name
        - kind
      properties:
        name:
          type: string
          description: The entity as written in the input.
        kind:
          type: string
          enum:
            - organization
            - location
            - person
            - date
      example:
        name: NASA
        kind: organization
    EvidenceItem:
      type: object
      required:
        - label
        - result
        - points
      properties:
        label:
          type: string
          description: Short name of the check performed.
        result:
          $ref: '#/components/schemas/EvidenceResult'
        points:
          type: integer
          description: Points the check contributed to the final trust score.
        note:
          type: string
          description: Optional plain-English explanation of the check.
    Interpretation:
      type: object
      required:
        - title
        - explanation
        - confidence
        - reasoning
        - supportingEvidenceCount
      properties:
        title:
          type: string
          description: Short name of the interpretation, e.g. "Literal reading".
        explanation:
          type: string
          description: Plain-English description of this reading.
        confidence:
          type: integer
          minimum: 0
          maximum: 100
          description: How plausible this interpretation is (0-100).
        reasoning:
          type: string
          description: Why this interpretation is plausible.
        supportingEvidenceCount:
          type: integer
          minimum: 0
          description: Number of scored checks consistent with this interpretation.
    WarningSignal:
      type: object
      required:
        - label
        - severity
        - description
      properties:
        label:
          type: string
          description: Name of the signal, e.g. "No citations or sources".
        severity:
          type: string
          enum:
            - high
            - medium
            - low
          description: How serious the signal is.
        description:
          type: string
          description: Plain-English explanation of the signal.
    Recommendation:
      type: object
      required:
        - title
        - description
      properties:
        title:
          type: string
          description: Short action, e.g. "Check WHOIS registration".
        description:
          type: string
          description: Why and how to perform the action.
    SourceGroup:
      type: object
      required:
        - category
        - items
      properties:
        category:
          type: string
          description: Category of the source, e.g. "Network infrastructure" or "Transport security".
        items:
          type: array
          items:
            $ref: '#/components/schemas/SourceEvidence'
    SourceEvidence:
      type: object
      required:
        - title
        - source
        - credibility
        - summary
      properties:
        title:
          type: string
          description: Name of the check or finding.
        source:
          type: string
          description: Where the evidence came from.
        credibility:
          type: string
          enum:
            - high
            - medium
            - low
            - unknown
          description: User-facing credibility of the source.
        publicationDate:
          type: string
          description: Publication date when observed. Empty when unknown; never fabricated.
        summary:
          type: string
          description: Plain-English account of what the evidence shows.
    Contradiction:
      type: object
      required:
        - sourceA
        - claimA
        - sourceB
        - claimB
        - whyTheyDisagree
        - confidenceInContradiction
      properties:
        sourceA:
          type: string
          description: First side of the disagreement.
        claimA:
          type: string
          description: What the first side claims.
        sourceB:
          type: string
          description: Second side of the disagreement.
        claimB:
          type: string
          description: What the second side claims.
        whyTheyDisagree:
          type: string
          description: Plain-English explanation of the disagreement.
        confidenceInContradiction:
          type: integer
          minimum: 0
          maximum: 100
          description: How strongly the evidence supports that the sides genuinely disagree.
    MissingInfo:
      type: object
      required:
        - item
        - whyItMatters
      properties:
        item:
          type: string
          description: What is missing, e.g. "Publication date".
        whyItMatters:
          type: string
          description: Consequence of the missing information.
    ConfidenceBreakdown:
      type: object
      required:
        - overall
        - metrics
      properties:
        overall:
          type: integer
          minimum: 0
          maximum: 100
          description: Overall confidence, mirroring the analysis confidence.
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/ConfidenceMetric'
    ConfidenceMetric:
      type: object
      required:
        - name
        - score
        - note
      properties:
        name:
          type: string
          description: User-friendly metric name, e.g. "Source credibility".
        score:
          type: integer
          minimum: 0
          maximum: 100
          description: User-facing metric value.
        note:
          type: string
          description: Plain-English explanation of what the metric reflects.
    SuggestedReading:
      type: object
      required:
        - title
        - publisher
        - whyItHelps
      properties:
        title:
          type: string
          description: Title of the recommended material or search target.
        publisher:
          type: string
          description: Publisher or kind of publisher to consult.
        whyItHelps:
          type: string
          description: How this material helps the user.
    ChangeEvent:
      type: object
      required:
        - date
        - event
      properties:
        date:
          type: string
          description: Observed date of the event.
        event:
          type: string
          description: What happened on that date.
    Evidence:
      type: object
      required:
        - label
        - result
        - points
      properties:
        label:
          type: string
          description: Short name of the check performed, e.g. "HTTPS Available".
        result:
          $ref: '#/components/schemas/EvidenceResult'
        points:
          type: integer
          description: Points the check contributed to the final trust score.
      example:
        label: HTTPS Available
        result: pass
        points: 20
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Description of the error.
    InputType:
      type: string
      description: Detected type of the input.
      enum:
        - domain
        - url
        - email
        - phone
        - company
        - ipv4
        - ipv6
        - unknown
    VerificationStatus:
      type: string
      description: Outcome of the verification.
      enum:
        - verified
        - warning
        - invalid
        - private
        - local
        - unreachable
        - suggestion
        - unknown
        - not_implemented
    EvidenceResult:
      type: string
      description: Result of a single evidence check.
      enum:
        - pass
        - warning
        - fail
        - info
